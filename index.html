  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#161412" />
      <path d="M50,24 A26,26 0 0,1 73,63" fill="none" stroke="#EDE9E0" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round" />
      <path d="M73,63 A26,26 0 0,1 27,63" fill="none" stroke="#EDE9E0" stroke-opacity="0.25" stroke-width="2.4" stroke-linecap="round" />

      <circle cx="27" cy="63" r="6.5" fill="#EDE9E0" />
    </svg>
  </template>

  <!-- PWA: register the service worker (offline) + capture the install prompt -->
  <script>
    (function () {
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
      // Stash the deferred install prompt so the app can offer “add to home screen.”
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__samlaInstall = e;
        window.dispatchEvent(new Event("samla-installable"));
      });
      window.addEventListener("appinstalled", function () {
        window.__samlaInstall = null;
        window.dispatchEvent(new Event("samla-installed"));
      });
    })();
  </script>
